name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint · typecheck · build · test)
    runs-on: ubuntu-latest

    # Postgres for the DB-backed integration tests (gated on TEST_DATABASE_URL).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: casimir
          POSTGRES_PASSWORD: casimir
          POSTGRES_DB: casimirq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U casimir -d casimirq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://casimir:casimir@localhost:5432/casimirq_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm run build

      # Fail if the committed OpenAPI spec has drifted from the code. Regenerate
      # from the freshly-built dist and diff against the checked-in openapi.json.
      - name: OpenAPI spec is up to date
        run: |
          node dist/scripts/generate-openapi.js
          if ! git diff --exit-code openapi.json; then
            echo "::error::openapi.json is stale — run 'npm run openapi:generate' and commit the result."
            exit 1
          fi

      - run: npm run test:ci

  frontend:
    name: Frontend (lint · typecheck · build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:ci
