services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: casimir
      POSTGRES_PASSWORD: casimir
      POSTGRES_DB: casimirq
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U casimir -d casimirq']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply DB migrations, then exit. Backend waits for this to finish.
  migrate:
    build:
      context: .
    command: npm run migrate
    environment:
      DATABASE_URL: postgres://casimir:casimir@postgres:5432/casimirq
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
    environment:
      DATABASE_URL: postgres://casimir:casimir@postgres:5432/casimirq
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      PORT: '3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '3000:3000'

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - '8080:80'

  # Scrapes the backend's /metrics endpoint over the compose network.
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    depends_on:
      - backend
      - alertmanager
    ports:
      - '9090:9090'

  # Receives firing alerts from Prometheus; UI on :9093.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - '9093:9093'

  # Dashboards over Prometheus; datasource + starter dashboard are provisioned.
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - '3001:3000'

volumes:
  pgdata:
  promdata:
  grafanadata:
