# Prometheus scrape configuration for the casimirQ stack.
#
# The backend exposes metrics at `GET /metrics` (Prometheus text exposition
# format) on its internal port 3000. Prometheus reaches it by service name over
# the compose network, so no host ports are involved.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: casimirq-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:3000']
        labels:
          service: casimirq-backend

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
