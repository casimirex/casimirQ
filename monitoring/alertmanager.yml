# Alertmanager configuration for the casimirQ stack.
#
# Alerts from Prometheus land here and are visible in the Alertmanager UI
# (http://localhost:9093). The default receiver has no external integration, so
# nothing is sent outward — add a slack_configs / email_configs / webhook_configs
# block to actually notify (example commented below), keeping secrets out of the
# repo (use env-substituted values or a secrets file).
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: default
    # No integrations configured — alerts still show in the UI at :9093.
    # To notify a Slack channel, uncomment and set the webhook URL:
    # slack_configs:
    #   - api_url: '<SLACK_WEBHOOK_URL>'
    #     channel: '#casimirq-alerts'
    #     send_resolved: true

inhibit_rules:
  # A firing BackendDown makes the HTTP/workload alerts noise — suppress them.
  - source_matchers: [severity = critical]
    target_matchers: [severity = warning]
    equal: [service]
